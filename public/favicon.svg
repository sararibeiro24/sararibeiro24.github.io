<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Modern dark squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Combined S + R Geometric Monogram -->
  <!-- R vertical stem -->
  <line x1="22" y1="16" x2="22" y2="48" stroke="url(#primary)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- S curve weaving from top right, through center, to bottom left -->
  <path d="M 41 20 C 41 16 22 16 22 23.5 C 22 31.5 42 30.5 42 39.5 C 42 48 24 48 22 44" 
        fill="none" 
        stroke="url(#primary)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- R diagonal dynamic leg -->
  <line x1="31" y1="31.5" x2="42" y2="48" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
